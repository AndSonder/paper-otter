name: Bug report
description: Report a reproducible problem in the reader, content pipeline, or skill.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest sequence of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or version, if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser, and relevant Codex version.
