name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run skill:check
      - run: npm audit --omit=dev
      - run: npm run build
      - name: Start preview server
        run: |
          npm run dev > /tmp/paper-daily.log 2>&1 &
          echo $! > /tmp/paper-daily.pid
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/paper-daily.log
          exit 1
      - run: npm test
      - name: Stop preview server
        if: always()
        run: test ! -f /tmp/paper-daily.pid || kill "$(cat /tmp/paper-daily.pid)" || true
